name: ParaBank Automation Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily smoke run at 06:00 UTC
  workflow_dispatch:

# Required for publishing Allure report to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8   # required for FixtureForge Unicode output
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Wait for ParaBank to be reachable
        run: |
          echo "Checking ParaBank availability…"
          for i in 1 2 3 4 5; do
            if curl -sf --max-time 10 \
                "https://parabank.parasoft.com/parabank/index.htm" > /dev/null; then
              echo "✅ ParaBank is reachable (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed — waiting 30 s before retry…"
            sleep 30
          done
          echo "❌ ParaBank unreachable after 5 attempts (2.5 min) — aborting CI"
          exit 1

      - name: Run tests (with Failscope RCA)
        run: |
          python -m pytest \
            --failscope \
            --fs-offline \
            --alluredir=allure-results \
            --timeout=45 \
            -v

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Failscope report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failscope-report
          path: .failscope/
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Add Test Plan to Pages output
        if: always()
        run: |
          # Serve the STP alongside the Allure report under the same Pages domain.
          # Allure owns the root (index.html); test plan lives at /test-plan.html
          cp Parabank_Test_Plan_v1.0.html allure-report/test-plan.html

      - name: Publish Allure report + Test Plan to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
