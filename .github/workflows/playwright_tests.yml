name: ParaBank Automation Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # daily smoke run at 06:00 UTC
  workflow_dispatch:

# Required for publishing Allure report to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # ── ParaBank runs as a local Docker service — no dependency on the public demo
    services:
      parabank:
        image: parasoft/parabank
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/parabank/index.htm || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      PYTHONIOENCODING: utf-8   # required for FixtureForge Unicode output
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PARABANK_BASE_URL: http://localhost:8080/parabank

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Confirm ParaBank Docker is ready
        run: |
          echo "ParaBank container health-check passed — service is ready at $PARABANK_BASE_URL"
          curl -sf "$PARABANK_BASE_URL/index.htm" > /dev/null && echo "✅ HTTP check OK"

      - name: Run tests (with Failscope RCA)
        run: |
          python -m pytest \
            --failscope \
            --fs-offline \
            --alluredir=allure-results \
            --timeout=45 \
            -v

      - name: Upload Allure results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 14

      - name: Upload Failscope report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failscope-report
          path: .failscope/
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          echo "/opt/allure/bin" >> $GITHUB_PATH

      - name: Generate Allure HTML report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Add Test Plan to Pages output
        if: always()
        run: |
          # Serve the STP alongside the Allure report under the same Pages domain.
          # Allure owns the root (index.html); test plan lives at /test-plan.html
          cp Parabank_Test_Plan_v1.0.html allure-report/test-plan.html

      - name: Publish Allure report + Test Plan to GitHub Pages
        if: github.ref == 'refs/heads/main' && always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
